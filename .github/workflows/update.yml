name: update
on:
  schedule:
    - cron: "0 */2 * * *"   # UTC 偶数時 = JST 奇数時（開始は数分〜十数分遅れることがある）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  period:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: echo "active=$(python3 tools/tally.py --active)" >> "$GITHUB_OUTPUT"   # 締切+6時間まで true

  update:
    needs: period
    if: needs.period.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Collect new posts (Yahoo! realtime search)
        run: timeout 600 python3 tools/collect_yahoo.py

      - name: Fetch and tally
        env:
          MC_SALT: ${{ secrets.MC_SALT }}
        run: timeout 1200 python3 tools/tally.py > tally.txt && head -12 tally.txt

      - name: Build, commit and deploy (only when votes changed)
        env:
          CHROME: google-chrome
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if git diff --quiet data/votes.json; then echo "no new posts"; exit 0; fi
          timeout 180 python3 tools/trend.py
          git add data/votes.json public/trend.html public/trend-og.png
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: 投票データと推移ページを自動更新"
          git push
          timeout 300 npx --yes wrangler@4 deploy
