name: probe-yahoo
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Yahoo realtime search (3 pages)
        run: timeout 120 python3 tools/collect_yahoo.py --max-pages 3
      - name: fxtwitter reachability
        run: curl -s --max-time 15 -o /dev/null -w '%{http_code}\n' https://api.fxtwitter.com/i/status/2104230697573797996
      - name: Chrome
        run: which google-chrome || ls /usr/bin | grep -i chrom
