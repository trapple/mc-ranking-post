    hdots.innerHTML = D.series.map((s, k) =>
      `<circle cx="${x(i)}" cy="${y(s.cum[i])}" r="4" fill="${COLORS[k]}" stroke="var(--bg)" stroke-width="2"/>`).join("");
    const rows = D.series.map((s, k) => ({ s, k, v: s.cum[i] })).sort((a, b) => b.v - a.v);
    tip.innerHTML = `<header>${fmtHour(D.hours[i])}まで</header><ol>${rows.map(r =>
      `<li><i style="background:${COLORS[r.k]}"></i><span>${esc(r.s.artist)}</span><b>${r.v}</b></li>`).join("")}</ol>`;
    tip.hidden = false;
    const bw = box.clientWidth, tx = x(i) / W * bw;
    tip.style.left = (tx + 14 + tip.offsetWidth > bw ? tx - 14 - tip.offsetWidth : tx + 14) + "px";
  };
  const hide = () => { lastI = -1; hover.setAttribute("visibility", "hidden"); tip.hidden = true; };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", hide);
}
drawChart();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawChart, 120); });

  `<thead><tr><th>順位</th><th class="name">曲</th>${D.days.map(d => `<th>${d}</th>`).join("")}<th>合計</th></tr></thead><tbody>` +
  D.table.map((r, i) => `<tr><td>${r.rank}</td><td class="name">${i < D.series.length ? `<span class="sw" style="background:${COLORS[i]}"></span>` : ""}${esc(r.song)}<small>${esc(r.artist)}</small></td>${
    r.days.map(v => `<td>${v || "–"}</td>`).join("")}<td class="total">${r.total}</td></tr>`).join("") + "</tbody>";
</script>
