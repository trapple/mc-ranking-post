const COLORS = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"].map(v => `var(${v})`);

// ---- chart ----
function drawChart() {
  const box = $("chart");
  const W = Math.max(320, box.clientWidth), H = W < 560 ? 300 : 380;
  const m = { t: 12, r: W < 560 ? 12 : 150, b: 28, l: 40 };
  const n = D.hours.length, maxV = Math.max(...D.series.map(s => s.cum.at(-1)));
  const step = maxV > 200 ? 50 : maxV > 80 ? 20 : 10;
  const yMax = Math.ceil(maxV / step) * step;
  const x = i => m.l + (W - m.l - m.r) * (n <= 1 ? 0 : i / (n - 1));
  const y = v => m.t + (H - m.t - m.b) * (1 - v / yMax);
  let g = "";
  for (let v = 0; v <= yMax; v += step) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  D.hours.forEach((h, i) => {
    if (h.endsWith("T00:00") || i === 0) {
      g += `<line x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--line)" stroke-width="1"/>`;
      g += `<text x="${x(i) + 4}" y="${H - m.b + 16}">${fmtHour(h).split(" ")[0]}</text>`;
    }
  });
  let lines = "";
  for (let i = D.series.length - 1; i >= 0; i--) {  // 上位を最前面に描く
    const s = D.series[i];
    const d = s.cum.map((v, j) => `${j ? "L" : "M"}${x(j).toFixed(1)},${y(v).toFixed(1)}`).join("");
    lines += `<path d="${d}" fill="none" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round"/>`;
    lines += `<path d="${d}" fill="none" stroke="${COLORS[i]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  // 右端ラベル（上位5曲、重なりを避けて縦にずらす）
  let labels = "";
  if (m.r > 100) {
    const ends = D.series.slice(0, 5).map((s, i) => ({ i, v: s.cum.at(-1), y: y(s.cum.at(-1)), t: s.artist }));
    ends.sort((a, b) => a.y - b.y);
    for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 15) ends[k].y = ends[k - 1].y + 15;
    ends.forEach(e => {
      labels += `<circle cx="${x(n - 1)}" cy="${y(e.v)}" r="4" fill="${COLORS[e.i]}" stroke="var(--bg)" stroke-width="2"/>`;
      labels += `<text class="endlabel" x="${x(n - 1) + 10}" y="${e.y + 4}">${esc(e.t)} ${e.v}</text>`;
    });
  }
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="上位${D.series.length}曲の累計票数の推移">${g}${lines}${labels}
    <g id="hover" visibility="hidden"><line id="hline" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/><g id="hdots"></g></g>
    <rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" id="hit"/></svg>
    <div class="tip" id="tip" hidden></div>`;

  const hit = $("hit"), tip = $("tip"), hover = $("hover"), hline = $("hline"), hdots = $("hdots");
  let lastI = -1;
  const show = ev => {
    const r = hit.getBoundingClientRect();
    const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.round(px * (n - 1))));
    if (i === lastI) return;
    lastI = i;
    hover.setAttribute("visibility", "visible");
    hline.setAttribute("x1", x(i)); hline.setAttribute("x2", x(i));
    hdots.innerHTML = D.series.map((s, k) =>
      `<circle cx="${x(i)}" cy="${y(s.cum[i])}" r="4" fill="${COLORS[k]}" stroke="var(--bg)" stroke-width="2"/>`).join("");
    const rows = D.series.map((s, k) => ({ s, k, v: s.cum[i] })).sort((a, b) => b.v - a.v);
    tip.innerHTML = `<header>${fmtHour(D.hours[i])}まで</header><ol>${rows.map(r =>
      `<li><i style="background:${COLORS[r.k]}"></i><span>${esc(r.s.artist)}</span><b>${r.v}</b></li>`).join("")}</ol>`;
    tip.hidden = false;
    const bw = box.clientWidth, tx = x(i) / W * bw;

}
