<!doctype html>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#efeee9; --accent:#d63a86;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
* { box-sizing:border-box; margin:0 }
html, body { width:1200px; height:630px; overflow:hidden; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif; }
.card { position:absolute; inset:0; padding:52px 60px; display:grid; grid-template-columns:470px 1fr; gap:40px; }
.eyebrow { color:var(--accent); font-weight:700; font-size:22px; letter-spacing:.1em; }
h1 { font-family:"Dela Gothic One",sans-serif; font-weight:400; font-size:54px; line-height:1.15; margin-top:12px; }
.asof { color:var(--ink2); font-size:22px; margin-top:12px; }
ol { list-style:none; padding:0; margin-top:26px; display:grid; gap:10px; font-variant-numeric:tabular-nums; }
li { display:grid; grid-template-columns:22px 1fr auto; align-items:center; gap:12px; font-size:24px; }
li i { height:6px; border-radius:3px; }
li span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
li b { font-size:26px; }
.foot { position:absolute; left:60px; bottom:30px; color:var(--muted); font-size:18px; }
svg text { fill:var(--muted); font-size:16px; font-family:inherit; }
</style>
<div class="card">
  <div>
    <div class="eyebrow">VTuber楽曲ランキング 非公式</div>
    <h1 id="t"></h1>
    <div class="asof" id="a"></div>
    <ol id="l"></ol>
  </div>
  <svg id="c" viewBox="0 0 590 470"></svg>
</div>
<div class="foot">公開ポストのみの勝手に集計・DM票は含みません</div>
<script>
const D = /*__DATA__*/null;
const C = ["--s1","--s2","--s3","--s4","--s5"].map(v => `var(${v})`);
const S = D.series.slice(0, 5);
document.getElementById("t").innerHTML = `「${D.theme.replace(/[&<>]/g, "")}」<br>票数の推移`;
document.getElementById("a").textContent = `${D.asOf} 時点・有効票 ${D.counted.toLocaleString()}`;
document.getElementById("l").innerHTML = S.map((s, i) =>
  `<li><i style="background:${C[i]}"></i><span>${s.artist}</span><b>${s.cum.at(-1)}</b></li>`).join("");
const W = 590, H = 470, m = { t: 20, r: 10, b: 36, l: 48 }, n = D.hours.length;
const maxV = Math.max(...S.map(s => s.cum.at(-1))), step = maxV > 200 ? 50 : 20, yMax = Math.ceil(maxV / step) * step;
const x = i => m.l + (W - m.l - m.r) * i / Math.max(1, n - 1), y = v => m.t + (H - m.t - m.b) * (1 - v / yMax);
let g = "";
for (let v = 0; v <= yMax; v += step) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1.5"/><text x="${m.l - 8}" y="${y(v) + 5}" text-anchor="end">${v}</text>`;
D.hours.forEach((h, i) => { if (h.endsWith("T00:00")) { const [, mo, d] = h.slice(0, 10).split("-"); g += `<text x="${x(i) + 4}" y="${H - 10}">${+mo}/${+d}</text>`; } });
[...S].map((s, i) => [s, i]).reverse().forEach(([s, i]) => {
  const d = s.cum.map((v, j) => `${j ? "L" : "M"}${x(j).toFixed(1)},${y(v).toFixed(1)}`).join("");
  g += `<path d="${d}" fill="none" stroke="var(--bg)" stroke-width="8"/><path d="${d}" fill="none" stroke="${C[i]}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
});
document.getElementById("c").innerHTML = g;
</script>
